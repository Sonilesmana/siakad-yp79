<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App — SIAKAD SMK YP.79</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="assets/css/style.css"></head><body class="bg-scene min-h-screen">
<!-- LOGIN VIEW -->
<div id="loginView" class="min-h-screen flex items-center justify-center p-4"><div class="w-full max-w-5xl grid md:grid-cols-2 gap-4">
<div class="glass rounded-3xl p-8"><a href="index.html" class="text-xs text-cyan-300">← Landing</a><div class="flex items-center gap-3 mt-2"><div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-cyan-400 to-violet-600 flex items-center justify-center font-extrabold text-lg neon">YP</div><div><div class="font-extrabold font-display text-xl">SIAKAD SMK YP.79</div><div class="text-xs text-slate-400">Login multi-role • PPDB terpisah</div></div></div>
<div class="grid grid-cols-2 gap-2 mt-5"><button id="tabUser" class="py-2 rounded-xl text-sm font-bold btn-glow">Pengguna Sekolah</button><button id="tabPpdb" class="py-2 rounded-xl text-sm font-bold glass">Calon Siswa PPDB</button></div>
<div id="formUser" class="mt-4"><label class="text-xs text-slate-400">Email / NIS</label><input id="inEmail" class="input mt-1" placeholder="siswa@siswa.yp79"><label class="text-xs text-slate-400 mt-3 block">Password</label><input id="inPass" type="password" class="input mt-1" placeholder="••••••"><button id="btnLogin" class="btn-glow w-full mt-4 py-2.5 rounded-xl font-bold">Masuk Dashboard →</button><p id="loginMsg" class="text-sm text-red-300 mt-2"></p><button id="fillDemo" class="text-xs text-cyan-300 underline mt-1">isi otomatis demo siswa</button></div>
<div id="formPpdb" class="mt-4 hidden"><label class="text-xs text-slate-400">Email / No. Pendaftaran</label><input id="inEmail2" class="input mt-1" placeholder="calon@ppdb.yp79 / PPDB-2026-0001"><label class="text-xs text-slate-400 mt-3 block">Password</label><input id="inPass2" type="password" class="input mt-1" placeholder="ppdb123"><button id="btnLogin2" class="btn-glow w-full mt-4 py-2.5 rounded-xl font-bold">Masuk Portal PPDB →</button><p class="text-xs text-slate-400 mt-2">Belum daftar? Minta TU/Operator buatkan via menu PPDB, atau daftar langsung setelah login demo calon di samping.</p><p id="loginMsg2" class="text-sm text-red-300 mt-2"></p></div></div>
<div class="glass-strong rounded-3xl p-6"><h3 class="font-bold">🔑 Akun Demo (klik untuk isi)</h3><p class="text-xs text-slate-400">1 akun per role — password sesuai tabel</p><div id="demoList" class="mt-3 grid gap-1.5 max-h-[420px] overflow-auto text-sm"></div></div>
</div></div>
<!-- APP VIEW -->
<div id="appView" class="hidden"><div class="flex min-h-screen"><aside class="w-64 shrink-0 glass-strong border-r border-white/10 p-4 hidden md:flex flex-col gap-3 no-print"><a href="index.html" class="text-xs text-cyan-300">← Landing</a><div id="userBox" class="flex items-center gap-3"></div><nav id="sideNav" class="flex flex-col gap-1 overflow-auto"></nav><button onclick="Auth.logout()" class="glass px-4 py-2 rounded-xl text-sm mt-auto">⏻ Keluar</button></aside>
<div class="flex-1 min-w-0"><div class="md:hidden glass-strong p-3 flex items-center gap-2 no-print"><select id="mNav" class="input"></select><button onclick="Auth.logout()" class="glass px-3 py-2 rounded-lg text-sm">⏻</button></div><main id="content" class="p-4 md:p-6 max-w-6xl mx-auto"></main></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/env.js"></script>
<script src="assets/js/store.js"></script><script src="assets/js/supabase-client.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/app-logic.js"></script>
<script>
const $=s=>document.querySelector(s);
function showApp(u){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');AppInit(u);
 const menus=document.querySelectorAll('.sidebar-link');const m=$('#mNav');m.innerHTML=[...menus].map(a=>`<option value="${a.dataset.nav}">${a.textContent}</option>`).join('');m.onchange=()=>navGo(m.value);}
const cur=Auth.current();if(cur&&location.hash!=='#logout')showApp(cur);
if(location.hash==='#ppdb'){document.getElementById('tabPpdb').click();}
function doLogin(e,p,msg){const r=Auth.login(e,p);if(r.ok)showApp(r.user);else document.querySelector(msg).textContent=r.msg;}
$('#btnLogin').onclick=()=>doLogin($('#inEmail').value,$('#inPass').value,'#loginMsg');
$('#btnLogin2').onclick=()=>doLogin($('#inEmail2').value,$('#inPass2').value,'#loginMsg2');
$('#fillDemo').onclick=()=>{$('#inEmail').value='siswa@siswa.yp79';$('#inPass').value='siswa123';};
$('#tabUser').onclick=()=>{$('#formUser').classList.remove('hidden');$('#formPpdb').classList.add('hidden');};
$('#tabPpdb').onclick=()=>{$('#formPpdb').classList.remove('hidden');$('#formUser').classList.add('hidden');$('#inEmail2').value='calon@ppdb.yp79';$('#inPass2').value='ppdb123';};
$('#demoList').innerHTML=DEMO_ACCOUNTS.map(d=>`<button class="glass rounded-lg px-3 py-2 text-left hover:border-cyan-400/50" data-e="${d[1]}" data-p="${d[2]}"><b>${d[0]}</b><br><span class="text-xs text-cyan-300 font-mono">${d[1]}</span> <span class="text-xs text-slate-400 font-mono">/ ${d[2]}</span></button>`).join('');
document.querySelectorAll('#demoList button').forEach(b=>b.onclick=()=>{const isPpdb=b.dataset.e.includes('ppdb');if(isPpdb){document.getElementById('tabPpdb').click();$('#inEmail2').value=b.dataset.e.split(' / ')[0];$('#inPass2').value=b.dataset.p;}else{$('#inEmail').value=b.dataset.e;$('#inPass').value=b.dataset.p;}});
</script></body></html>
